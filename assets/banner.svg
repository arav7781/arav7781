<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Arav Saxena · Backend &amp; full-stack engineer</title>
  <desc id="d">Event-driven services in Java, Spring Boot, NestJS and Node.js with Kafka, PostgreSQL and Redis, and React/Next.js front ends. SDE Intern at Bajaj Finserv Health, B.Tech at SIT Pune.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#fffbf5"/>
      <stop offset="0.5" stop-color="#fff1e2"/>
      <stop offset="1" stop-color="#ffdcb8"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fdba74" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7c2d12" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="14"/></clipPath>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#a8a29e"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #fffdfa; stroke: #e0cfc0; stroke-width: 1.2; }
    .box.gw { stroke: #c2410c; }
    .box.dlq { stroke: #dc2626; stroke-opacity: 0.7; }
    .lbl { fill: #292524; font-size: 12px; }
    .sub { fill: #a8a29e; font-size: 10px; }
    .wire { stroke: #b8a99b; stroke-width: 1.2; fill: none; }
    .wire.dash { stroke-dasharray: 3 4; }
    .cell { fill: #ea580c; opacity: 0.12; animation: append 4.8s linear infinite; }
    @keyframes append { 0% { opacity: 0.12; } 6% { opacity: 0.85; } 70% { opacity: 0.4; } 100% { opacity: 0.12; } }
    @media (prefers-reduced-motion: reduce) { .cell { animation: none; opacity: 0.45; } .pkt { display: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#warm)"/>
    <rect x="610" width="590" height="340" fill="url(#dots)"/>

    <!-- text -->
    <g class="sans">
      <rect x="72" y="74" width="28" height="3" fill="#c2410c"/>
      <text x="69" y="146" font-size="60" font-weight="700" letter-spacing="-1.6" fill="#1c1917">Arav Saxena</text>
      <text x="72" y="186" font-size="24" font-weight="500" fill="#44403c">Backend &amp; full-stack engineer</text>
      <text x="72" y="226" font-size="16.5" fill="#57534e">I build event-driven services that don’t lose or</text>
      <text x="72" y="249" font-size="16.5" fill="#57534e">double-process data, and the web apps on top of them.</text>
    </g>
    <g class="mono" font-size="12.5" fill="#78716c">
      <text x="72" y="294">Java · Spring Boot · NestJS · Kafka · PostgreSQL · Redis · Next.js</text>
    </g>
    <g class="sans" font-size="13.5" fill="#8a817a">
      <text x="72" y="317">SDE Intern, Bajaj Finserv Health  ·  B.Tech, SIT Pune</text>
    </g>

    <!-- system diagram -->
    <g class="mono">
      <path id="w1" class="wire" d="M755 168 C775 168 775 104 795 104" marker-end="url(#arrow)"/>
      <path id="w2" class="wire" d="M755 168 L795 168" marker-end="url(#arrow)"/>
      <path id="w3" class="wire" d="M755 168 C775 168 775 232 795 232" marker-end="url(#arrow)"/>
      <path id="w4" class="wire" d="M907 104 C926 104 926 131 945 131" marker-end="url(#arrow)"/>
      <path id="w5" class="wire" d="M907 168 L945 168" marker-end="url(#arrow)"/>
      <path id="w6" class="wire" d="M907 232 C926 232 926 205 945 205" marker-end="url(#arrow)"/>
      <path id="w7" class="wire" d="M1061 131 C1074 131 1072 104 1086 104" marker-end="url(#arrow)"/>
      <path id="w8" class="wire" d="M1061 168 L1086 168" marker-end="url(#arrow)"/>
      <path id="w9" class="wire" d="M1061 205 C1074 205 1072 232 1086 232" marker-end="url(#arrow)"/>
      <path class="wire dash" d="M700 186 L700 228"/>
      <path class="wire dash" d="M851 249 L851 272"/>

      <rect class="box gw" x="645" y="150" width="110" height="36" rx="6"/>
      <text class="lbl" x="700" y="166" text-anchor="middle">API gateway</text>
      <text class="sub" x="700" y="179" text-anchor="middle">REST · GraphQL</text>

      <g transform="translate(672 228)">
        <path d="M0 6 v20 a28 6 0 0 0 56 0 v-20" fill="#fffdfa" stroke="#e0cfc0" stroke-width="1.2"/>
        <ellipse cx="28" cy="6" rx="28" ry="6" fill="#fdf6ee" stroke="#e0cfc0" stroke-width="1.2"/>
        <text class="lbl" x="28" y="25" text-anchor="middle" font-size="11">Redis</text>
      </g>

      <rect class="box" x="795" y="87" width="112" height="34" rx="6"/>
      <text class="lbl" x="851" y="102" text-anchor="middle">order-svc</text>
      <text class="sub" x="851" y="115" text-anchor="middle">NestJS</text>
      <rect class="box" x="795" y="151" width="112" height="34" rx="6"/>
      <text class="lbl" x="851" y="166" text-anchor="middle">claims-svc</text>
      <text class="sub" x="851" y="179" text-anchor="middle">Spring Boot</text>
      <rect class="box" x="795" y="215" width="112" height="34" rx="6"/>
      <text class="lbl" x="851" y="230" text-anchor="middle">payment-svc</text>
      <text class="sub" x="851" y="243" text-anchor="middle">Node.js</text>

      <g transform="translate(815 272)">
        <path d="M0 6 v20 a36 6 0 0 0 72 0 v-20" fill="#fffdfa" stroke="#e0cfc0" stroke-width="1.2"/>
        <ellipse cx="36" cy="6" rx="36" ry="6" fill="#fdf6ee" stroke="#e0cfc0" stroke-width="1.2"/>
        <text class="lbl" x="36" y="25" text-anchor="middle" font-size="11">PostgreSQL</text>
      </g>

      <text x="1003" y="97" text-anchor="middle" fill="#9a3412" font-size="11">payments.v1</text>
      <rect class="box" x="945" y="106" width="116" height="124" rx="6"/>
      <g font-size="10" fill="#a8a29e">
        <text x="953" y="135">p0</text>
        <text x="953" y="172">p1</text>
        <text x="953" y="209">p2</text>
      </g>
      <g>
        <rect class="cell" x="973" y="123" width="11" height="16" rx="1.5" style="animation-delay:0s"/>
        <rect class="cell" x="987" y="123" width="11" height="16" rx="1.5" style="animation-delay:.8s"/>
        <rect class="cell" x="1001" y="123" width="11" height="16" rx="1.5" style="animation-delay:1.6s"/>
        <rect class="cell" x="1015" y="123" width="11" height="16" rx="1.5" style="animation-delay:2.4s"/>
        <rect class="cell" x="1029" y="123" width="11" height="16" rx="1.5" style="animation-delay:3.2s"/>
        <rect class="cell" x="1043" y="123" width="11" height="16" rx="1.5" style="animation-delay:4s"/>
        <rect class="cell" x="973" y="160" width="11" height="16" rx="1.5" style="animation-delay:.4s"/>
        <rect class="cell" x="987" y="160" width="11" height="16" rx="1.5" style="animation-delay:1.2s"/>
        <rect class="cell" x="1001" y="160" width="11" height="16" rx="1.5" style="animation-delay:2s"/>
        <rect class="cell" x="1015" y="160" width="11" height="16" rx="1.5" style="animation-delay:2.8s"/>
        <rect class="cell" x="1029" y="160" width="11" height="16" rx="1.5" style="animation-delay:3.6s"/>
        <rect class="cell" x="1043" y="160" width="11" height="16" rx="1.5" style="animation-delay:4.4s"/>
        <rect class="cell" x="973" y="197" width="11" height="16" rx="1.5" style="animation-delay:.2s"/>
        <rect class="cell" x="987" y="197" width="11" height="16" rx="1.5" style="animation-delay:1s"/>
        <rect class="cell" x="1001" y="197" width="11" height="16" rx="1.5" style="animation-delay:1.8s"/>
        <rect class="cell" x="1015" y="197" width="11" height="16" rx="1.5" style="animation-delay:2.6s"/>
        <rect class="cell" x="1029" y="197" width="11" height="16" rx="1.5" style="animation-delay:3.4s"/>
        <rect class="cell" x="1043" y="197" width="11" height="16" rx="1.5" style="animation-delay:4.2s"/>
      </g>
      <text x="1003" y="250" text-anchor="middle" fill="#a8a29e" font-size="10">Avro · schema registry</text>

      <rect class="box" x="1086" y="88" width="94" height="32" rx="6"/>
      <text class="lbl" x="1133" y="103" text-anchor="middle" font-size="11">fulfillment</text>
      <text class="sub" x="1133" y="115" text-anchor="middle" font-size="9">consumer group</text>
      <rect class="box" x="1086" y="152" width="94" height="32" rx="6"/>
      <text class="lbl" x="1133" y="167" text-anchor="middle" font-size="11">ledger</text>
      <text class="sub" x="1133" y="179" text-anchor="middle" font-size="9">idempotent</text>
      <rect class="box dlq" x="1086" y="216" width="94" height="32" rx="6"/>
      <text class="lbl" x="1133" y="231" text-anchor="middle" font-size="11" fill="#b91c1c">DLQ</text>
      <text class="sub" x="1133" y="243" text-anchor="middle" font-size="9">poison messages</text>
    </g>

    <g class="pkt">
      <circle r="3" fill="#ea580c"><animateMotion dur="1.8s" begin="0s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
      <circle r="3" fill="#ea580c"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
      <circle r="3" fill="#ea580c"><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
      <circle r="3" fill="#ea580c"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>
      <circle r="3" fill="#ea580c"><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle>
      <circle r="3" fill="#ea580c"><animateMotion dur="1.6s" begin="1.4s" repeatCount="indefinite"><mpath href="#w6"/></animateMotion></circle>
      <circle r="3" fill="#ea580c"><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite"><mpath href="#w7"/></animateMotion></circle>
      <circle r="3" fill="#ea580c"><animateMotion dur="1.4s" begin="1.1s" repeatCount="indefinite"><mpath href="#w8"/></animateMotion></circle>
      <circle r="3" fill="#dc2626"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#w9"/></animateMotion></circle>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="none" stroke="#f3d9c2"/>
</svg>
